/var/log/nginx/*.log {
    daily
    dateext
    dateformat -%Y%m%d
    rotate 30
    compress
    # 压缩推迟到下一轮转周期：reopen 是异步信号，立即压缩可能截断
    # 尚未完成 reopen 的 worker 仍持有的旧文件句柄，导致日志丢失。
    delaycompress
    missingok
    notifempty
    # 日志目录经 bind mount 自宿主机（属主非 root/nginx），必须显式指定 su，
    # 否则 logrotate 以 insecure permissions 拒绝轮转。
    su root root
    create 0644 nginx nginx
    # 多个日志文件共享一次 reopen：无 sharedscripts 时每个文件各触发一次，
    # 6 个日志 = 6 次冗余信号。
    sharedscripts
    postrotate
        /usr/sbin/nginx -s reopen > /dev/null 2>&1
    endscript
}
