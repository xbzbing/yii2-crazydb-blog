server {
    charset utf-8;
    listen 80;
    server_name _;

    root /opt/webroot/public;
    index index.html index.htm index.php;

    access_log /opt/log/nginx/web_access.log;
    error_log /opt/log/nginx/web_error.log;

    # 后台 JSON API：回退 PHP 应用
    location ^~ /admin/api {
        try_files $uri /index.php$is_args$args;
    }

    # 后台图片上传：回退 PHP 应用（Vditor / SPA 上传共用）
    location ^~ /admin/upload {
        try_files $uri /index.php$is_args$args;
    }

    # 后台 SPA：静态托管 + history 路由回退到 index.html
    location ^~ /admin {
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php:9000;
        try_files $uri =404;
    }

    location ~ \.(htaccess|svn|git) {
        deny all;
    }
}
