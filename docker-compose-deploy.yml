# ============================================================
# CrazyDB Blog - 生产环境 Docker Compose
# 用法：
#   1. cp .env.example .env && vim .env   # 填写必填配置
#   2. docker compose up -d               # 启动服务
#   3. docker compose run init             # 首次初始化数据库（可选）
# ============================================================

networks:
  frontend:
  backend:

services:
  nginx:
    build:
      context: ./deploy/nginx-alpine
    image: blog-nginx:1.30-alpine
    container_name: blog-nginx
    environment:
      - TZ=Asia/Shanghai
    command: /bin/sh -c "crond -f -l 2 & nginx -g 'daemon off;'"
    volumes:
      - ./config/sites-enabled:/etc/nginx/conf.d
      - ./:/opt/webroot
      - ./data/nginx/log:/var/log/nginx
      # SSL 证书（取消注释并配置路径）
      # - ${SSL_CERT_PATH:-./ssl/cert.pem}:/etc/nginx/ssl/cert.pem:ro
      # - ${SSL_KEY_PATH:-./ssl/key.pem}:/etc/nginx/ssl/key.pem:ro
    depends_on:
      - php
    networks:
      - frontend
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    restart: unless-stopped

  php:
    build:
      context: ./deploy/php8-alpine
    image: blog-php:8.5-fpm-alpine
    container_name: blog-php
    env_file: .env
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./:/opt/webroot
      - ./data/blog-yii/risk-runtime:/opt/log/php
      - ./deploy/php8-alpine/php-uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini:ro
    networks:
      - frontend
      - backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: blog-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - TZ=Asia/Shanghai
    volumes:
      - ./data/blog-mysql:/var/lib/mysql
    ports:
      - "${DB_PORT_EXPOSE:-127.0.0.1:3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: blog-redis
    environment:
      - TZ=Asia/Shanghai
    command: "redis-server --requirepass ${REDIS_PASSWORD}"
    volumes:
      - ./data/blog-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    ports:
      - "${REDIS_PORT_EXPOSE:-127.0.0.1:6379}:6379"
    networks:
      - backend

  # 一次性初始化容器：docker compose run init
  # 通过 Yii3 控制台命令检查数据库状态并自动执行升级
  init:
    image: blog-php:8.5-fpm-alpine
    container_name: blog-init
    env_file: .env
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./:/opt/webroot
    networks:
      - backend
    depends_on:
      mysql:
        condition: service_healthy
    working_dir: /opt/webroot
    command: ["php", "yii", "init/migrate"]
    restart: "no"
