# ============================================================
# CrazyDB Blog - 生产环境 Docker Compose
# 用法：
#   1. cp .env.example .env && vim .env   # 填写必填配置
#   2. docker compose up -d               # 启动服务
#   3. docker compose exec php php yii init/migrate   # 首次初始化数据库（可选）
# ============================================================

networks:
  frontend:
  backend:

services:
  nginx:
    build:
      context: ${APP_SRC_DIR:-.}/deploy/nginx-alpine
    image: blog-nginx:1.30-alpine
    container_name: blog-nginx
    environment:
      - TZ=Asia/Shanghai
    command: /bin/sh -c "crond -f -l 2 & nginx -g 'daemon off;'"
    volumes:
      - ${APP_SRC_DIR:-.}:/opt/webroot
      - ${DEPLOY_DATA_DIR:-./data}/nginx/sites-enabled:/etc/nginx/conf.d
      - ${DEPLOY_DATA_DIR:-./data}/nginx/log:/var/log/nginx
      # SSL 证书目录（预留目录）
      - ${DEPLOY_DATA_DIR:-./data}/ssl:/etc/nginx/ssl
    depends_on:
      - php
    networks:
      - frontend
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    restart: unless-stopped

  php:
    build:
      context: ${APP_SRC_DIR:-.}/deploy/php8-alpine
    image: blog-php:8.5-fpm-alpine
    container_name: blog-php
    # 以宿主机 uid:gid 运行（默认 1001:1001），保证 bind mount 源码目录可写；
    # 宿主机 uid 不同时覆盖为 user: "<uid>:<gid>"
    user: "1001:1001"
    env_file: .env
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ${APP_SRC_DIR:-.}:/opt/webroot
      - ${APP_SRC_DIR:-.}/deploy/php8-alpine/php-uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini:ro
      - ${DEPLOY_DATA_DIR:-./data}/blog-yii/risk-runtime:/opt/log/php
    networks:
      - frontend
      - backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: blog-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - TZ=Asia/Shanghai
    volumes:
      - ${DEPLOY_DATA_DIR:-./data}/blog-mysql:/var/lib/mysql
    ports:
      - "${DB_PORT_EXPOSE:-127.0.0.1:3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: blog-redis
    environment:
      - TZ=Asia/Shanghai
    command: "redis-server --requirepass ${REDIS_PASSWORD}"
    volumes:
      - ${DEPLOY_DATA_DIR:-./data}/blog-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    ports:
      - "${REDIS_PORT_EXPOSE:-127.0.0.1:6379}:6379"
    networks:
      - backend

