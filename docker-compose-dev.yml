networks:
  frontend:
  backend:


services:
  nginx:
    build:
      context: ./deploy/nginx-alpine
    image: blog-nginx:1.30-alpine
    container_name: blog-nginx
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./config/sites-enabled:/etc/nginx/conf.d
      - ~/data/nginx/log:/opt/log/nginx
      - ./:/opt/webroot
    depends_on:
      - php
    networks:
      - frontend
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"


  php:
    build:
      context: ./deploy/php8-alpine
    image: blog-php:8.5-fpm-alpine
    container_name: blog-php
    environment:
      - TZ=Asia/Shanghai
      - DBGP_IDEKEY=docker-php-debug
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=crazydb
      - DB_USER=root
      - DB_PASSWORD=mysql.password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis.password
    volumes:
      - ./:/opt/webroot
      - ~/data/blog-yii/risk-runtime:/opt/log/php
    networks:
      - frontend
      - backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped


  mysql:
    image: mysql:8.4
    container_name: blog-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=mysql.password
      - TZ=Asia/Shanghai
    volumes:
      - ~/data/blog-mysql:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmysql.password"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - backend


  redis:
    image: redis:7-alpine
    container_name: blog-redis
    environment:
      - TZ=Asia/Shanghai
    command: "redis-server --requirepass redis.password"
    volumes:
      - ~/data/blog-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis.password", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - backend

